# Local development: `docker compose watch` (see README).
# Source is synced into the container by Compose Watch instead of a bind mount,
# because Windows bind mounts deliver no file events and Turbopack would not reload.
services:
  web:
    build: .
    image: helvetique-dev
    container_name: helvetique-dev
    ports:
      # Host port 3000 is often taken by other local projects; override with HOST_PORT.
      - "${HOST_PORT:-3010}:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_SITE_URL: "http://localhost:${HOST_PORT:-3010}"
    develop:
      watch:
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: package.json
        - action: sync+restart
          path: next.config.ts
          target: /app/next.config.ts
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json
            - next.config.ts
